<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a quote</title>
<!-- Public lead form. Link to it or embed it:
     <iframe src="https://mashadf.github.io/trade-crm/lead-form.html?b=BUSINESS_ID" style="width:100%;max-width:520px;height:640px;border:0"></iframe>
     Optional URL options: &name=Business%20Name  &accent=ea580c  &services=Pressure%20washing|Gutters|Other
     It can only ADD a lead to one business. It can never read anything back (database rule). -->
<style>
  :root{--accent:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:transparent}
  form,.done{max-width:520px;margin:0 auto;padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:16px}
  h1{font-size:20px;margin:0 0 4px}.sub{color:#64748b;font-size:14px;margin:0 0 14px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#334155}
  input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
  textarea{min-height:84px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:420px){.two{grid-template-columns:1fr}}
  .check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;color:#475569;margin-top:12px}
  .check input{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--accent)}
  button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6}
  .hp{position:absolute!important;left:-5000px!important;width:1px;height:1px;overflow:hidden}
  .err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:12px;font-size:14px}
  .fine{font-size:12px;color:#94a3b8;margin-top:10px;text-align:center}
  .done{text-align:center;padding:36px 18px}.done .big{font-size:44px}
</style>
</head>
<body>
<form id="f" novalidate>
  <h1 id="title">Request a free quote</h1>
  <p class="sub" id="sub">Tell us what you need. We usually reply within the hour.</p>
  <label for="name">Name *</label><input id="name" name="name" autocomplete="name" required maxlength="200">
  <div class="two">
    <div><label for="phone">Mobile phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="200"></div>
  </div>
  <label for="address">Service address</label><input id="address" name="address" autocomplete="street-address" maxlength="300">
  <label for="service">What do you need?</label><select id="service" name="service"></select>
  <label for="message">Details</label><textarea id="message" name="message" maxlength="2000" placeholder="Size, timing, photos you can text later…"></textarea>
  <label class="check"><input type="checkbox" name="sms_ok" id="sms_ok"> <span>OK to text me about this request. Msg &amp; data rates may apply. Reply STOP to opt out.</span></label>
  <!-- spam trap: people never see or fill these -->
  <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label><label>Fax <input name="company_fax" tabindex="-1" autocomplete="off"></label></div>
  <button id="go" type="submit">Send request</button>
  <div class="err" id="err" hidden></div>
  <div class="fine">We only use your details to reply to this request.</div>
</form>
<div class="done" id="done" hidden><div class="big">✅</div><h1>Thanks! We got it.</h1><p class="sub">We'll call or text you shortly.<span id="callNow"></span></p></div>
<script src="config.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  const L = CRMLogic, ST = CRMStore, CFG = window.CRM_CONFIG || {};
  const p = new URLSearchParams(location.search);
  const businessId = p.get('b') || '';
  const started = Date.now();
  const accent = (p.get('accent') || '').replace(/[^0-9a-f]/gi, '');
  if (/^[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent', '#' + accent);
  if (p.get('name')) document.getElementById('title').textContent = 'Request a quote from ' + p.get('name').slice(0, 80);
  const services = (p.get('services') || 'Get a quote|Repair|Install|Cleaning|Other').split('|').slice(0, 15);
  document.getElementById('service').innerHTML = services.map(s => `<option>${L.esc(s.slice(0, 80))}</option>`).join('');
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  const showErr = m => { err.hidden = false; err.textContent = m; go.disabled = false; };
  const done = () => { f.hidden = true; document.getElementById('done').hidden = false; };
  const check = L.checkConfig(CFG);
  let clientP = null;
  if (check.mode === 'cloud' && check.ok) clientP = new Promise(res => { const s = document.createElement('script'); s.src = 'vendor/supabase.js'; s.onload = () => res(supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false } })); s.onerror = () => res(null); document.head.appendChild(s); });
  f.onsubmit = async e => {
    e.preventDefault(); err.hidden = true; go.disabled = true;
    const form = { name: f.name.value, phone: f.phone.value, email: f.email.value, address: f.address.value, service: f.service.value, message: f.message.value,
      sms_ok: f.sms_ok.checked, website: f.website.value, company_fax: f.company_fax.value, started_at: started };
    const r = L.cleanLead(form, clientP ? businessId : (businessId || 'demo'));
    if (r.spam) return done();                 // silently "succeed" for bots
    if (!r.ok) return showErr(r.error);
    try {
      if (clientP) { const client = await clientP; if (!client) throw new Error('Could not connect. Please call us instead.'); await ST.submitPublicLead(client, r.lead); }
      else { const s = ST.DemoStore(); await s.init(); await s.insert('leads', Object.assign({}, r.lead, { business_id: 'demo', status: 'new', source: 'Website form' })); }
      done();
    } catch (ex) { showErr(/Too many/.test(ex.message) ? ex.message : 'Sorry, that did not go through. Please try again or call us.'); }
  };
})();
</script>
</body>
</html>
